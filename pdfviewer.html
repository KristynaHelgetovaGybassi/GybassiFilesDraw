<style>
  .pdf-gallery {
    max-width: 1100px;
    margin: 0 auto;
    font-family: sans-serif;
    padding: 20px;
  }

  /* rozložení: vlevo seznam, vpravo viewer */
  .pdf-layout {
    display: flex;
    gap: 16px;
    align-items: stretch;
  }

  .pdf-list {
    width: 260px;
    max-height: 80vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .pdf-item {
    padding: 10px;
    background: #f3f3f3;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.2s;
    font-size: 15px;
  }

  .pdf-item:hover {
    background: #e4e4e4;
  }

  .pdf-item.active {
    background: #d7eaff;
    border-left: 4px solid #1b80ff;
  }

  .pdf-viewer {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .viewer-title {
    font-weight: bold;
    margin: 0;
  }

  iframe {
    width: 100%;
    height: 80vh;
    border: 1px solid #ddd;
    border-radius: 8px;
  }

  /* na mobilech pod sebe */
  @media (max-width: 768px) {
    .pdf-layout {
      flex-direction: column;
    }
    .pdf-list {
      width: 100%;
      max-height: none;
    }
  }
</style>

<div class="pdf-gallery">
  <h2>Newsletter Archiv</h2>

  <div class="pdf-layout">
    <div class="pdf-list" id="pdfList"></div>

    <div class="pdf-viewer">
      <div class="viewer-title" id="viewerTitle">Načítám…</div>
      <iframe id="pdfFrame"></iframe>
    </div>
  </div>
</div>

<script>
  // Seznam PDF – jen přidáváš řádky
  const pdfFiles = [
    { file: "odkaz", title: "Newsletter listopad 2025" },
    { file: "https://kristynahelgetovagybassi.github.io/GybassiFilesDraw/%C5%99%C3%ADjen_2025_NEWSLETTER%20GYBASSI.pdf", title: "Newsletter říjen 2025" },
    { file: "https://kristynahelgetovagybassi.github.io/GybassiFilesDraw/z%C3%A1%C5%99%C3%AD_2025_NEWSLETTER%20GYBASSI.pdf", title: "Newsletter září 2025" }
  ];

  const list  = document.getElementById("pdfList");
  const frame = document.getElementById("pdfFrame");
  const title = document.getElementById("viewerTitle");

  function loadPDF(index) {
    const item = pdfFiles[index];
    frame.src = item.file + "#zoom=page-width";
    title.textContent = item.title;

    document
      .querySelectorAll(".pdf-item")
      .forEach(el => el.classList.remove("active"));

    const active = document.getElementById("pdf-item-" + index);
    if (active) active.classList.add("active");
  }

  // vytvoření seznamu
  pdfFiles.forEach((item, index) => {
    const div = document.createElement("div");
    div.className = "pdf-item";
    div.id = "pdf-item-" + index;
    div.textContent = item.title;
    div.onclick = () => loadPDF(index);
    list.appendChild(div);
  });

  // 🔹 automaticky načte první PDF po načtení stránky
  if (pdfFiles.length > 0) {
    loadPDF(0);
  }
</script>
